<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UF-ARCHIVE // PROTO-SYSTEM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --bg: #f4f4f4;
      --line: rgba(0,0,0,0.08);
      --line-strong: rgba(0,0,0,0.18);
      --text: #111;
      --sub: rgba(0,0,0,0.45);
      --accent: #7a7a7a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
    }

    .font-orbitron { font-family: 'Orbitron', sans-serif; }    
  </style>
</head>
<body class="overflow-hidden w-screen h-screen relative selection:bg-black selection:text-white">
  
  <div class="grid-bg"></div>
  <div class="scan-lines"></div>

  <div id="ui-scale-wrapper">
    <div id="page-transition-overlay" class="page-transition-overlay"></div>
    <div class="relative w-[1300px] h-[800px] flex box-border border border-[var(--line-strong)] bg-[rgba(255,255,255,0.4)] backdrop-blur-sm">
      
      <div class="absolute -top-1 -left-1 w-4 h-4 border-t-[3px] border-l-[3px] border-black z-50"></div>
      <div class="absolute -top-1 -right-1 w-4 h-4 border-t-[3px] border-r-[3px] border-black z-50"></div>
      <div class="absolute -bottom-1 -left-1 w-4 h-4 border-b-[3px] border-l-[3px] border-black z-50"></div>
      <div class="absolute -bottom-1 -right-1 w-4 h-4 border-b-[3px] border-r-[3px] border-black z-50"></div>

      <div class="w-[120px] border-r border-[var(--line-strong)] flex flex-col items-center py-8 relative z-20 shrink-0">
        <div class="text-[var(--sub)] text-[10px] tracking-[4px] mb-1 font-bold uppercase">FILE NO.</div>
        <div id="sidebar-file-no" class="font-orbitron text-black text-3xl font-bold tracking-[6px] border-b border-[var(--line-strong)] pb-3 mb-6">010</div>
        
        <div id="barcode" class="flex gap-[2px] h-12 w-full px-4 opacity-40 mb-6 mix-blend-multiply ml-[15px]"></div>
        
        <div id="sidebar-icons" class="flex-1 flex flex-col items-center justify-start gap-3 w-full overflow-y-auto py-2">
          <!-- JS 렌더링 -->
        </div>

        <div class="mt-auto flex flex-col items-center gap-2 pt-4 w-full">
          <div class="w-12 h-[1px] bg-[var(--line-strong)] mb-[70px]"></div>
          <a href="../index.html" class="btn-back-main">BACK<br>TO MAIN</a>
        </div>
      </div>

      <!-- LEFT PAGE -->
      <div id="left-page" class="fade-content flex-1 p-10 relative flex flex-col border-r border-[var(--line)]">
        <div class="flex justify-between items-center mb-6">
          <div class="flex items-center gap-4">
            <div class="w-6 h-6 border border-[var(--line-strong)] flex items-center justify-center">
              <div class="w-2 h-2 bg-black"></div>
            </div>
            <div class="text-[var(--text)] text-xs tracking-[4px] font-bold uppercase flex items-center gap-2">
              <span class="opacity-45">TOP TIER</span>
              <span class="opacity-20">///</span>
              CHARACTER DATA SHEET
            </div>
          </div>
        </div>

        <div class="relative w-full aspect-[4/3.5] bg-[rgba(0,0,0,0.03)] border border-[var(--line)] p-4 mb-6 flex justify-center items-center">
          <div class="absolute inset-0 bg-[linear-gradient(to_right,var(--line)_1px,transparent_1px),linear-gradient(to_bottom,var(--line)_1px,transparent_1px)] bg-[size:20px_20px] opacity-50"></div>
          
          <div class="relative w-[90%] h-[90%] image-mask bg-white target-box flex items-center justify-center overflow-hidden">
             <img id="character-image" src="" alt="Character Portrait" class="absolute inset-0 w-full h-full object-cover z-10 hidden" loading="lazy" />
             
             <div id="no-image-pattern" class="absolute inset-0 bg-[repeating-linear-gradient(45deg,var(--line)0px,var(--line)2px,transparent_2px,transparent_8px)] opacity-20 hidden"></div>
             
             <div id="no-image-content" class="relative w-full h-full opacity-30 flex flex-col items-center justify-center mix-blend-multiply hidden">
                <i data-lucide="scan-line" class="w-16 h-16 mb-4 text-black"></i>
                <div id="portrait-missing-text" class="text-black font-orbitron font-bold tracking-[4px] text-xl text-center">
                  NO IMAGE DATA
                </div>
             </div>
             
             <div class="image-glitch z-20"></div>
          </div>

          <div class="absolute top-8 left-8 bg-black text-white px-6 py-2 flex items-center gap-3 z-30" style="clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%);">
            <span id="badge-name" class="font-orbitron font-bold text-2xl tracking-[4px]">EVA</span>
          </div>
          
          <div class="absolute right-4 top-1/4 h-1/2 measure-line z-30"></div>

          <div class="absolute bottom-2 right-6 w-[240px] z-40 bg-[rgba(255,255,255,0.85)] backdrop-blur-md p-3 border border-black shadow-lg">
            <div class="flex items-center gap-2 mb-1.5">
              <div class="bg-black text-white text-[9px] px-2 py-0.5 font-bold tracking-[2px] uppercase">SYS_NOTE</div>
            </div>
            <p id="info-notes" class="text-black text-[11px] leading-[1.6] font-medium tracking-[0.5px] border-l-2 border-black pl-2 max-h-[90px] overflow-y-auto"></p>
          </div>
        </div>

        <div class="flex justify-between items-end border-b border-[var(--line-strong)] pb-3 mb-6">
          <div class="flex items-baseline gap-4">
            <span id="info-code-short" class="font-orbitron text-5xl font-bold tracking-[2px] text-black">010</span>
            <div class="flex flex-col">
              <span class="text-[10px] text-[var(--sub)] tracking-[4px]">CODE_ID:</span>
              <span id="info-code-full" class="text-sm font-bold text-black tracking-[2px]">EVA_010</span>
            </div>
          </div>
          <div id="info-affiliation-tag" class="text-[var(--sub)] text-[10px] tracking-[5px] uppercase font-bold">UNKNOWN FUTURE</div>
        </div>

        <div class="flex justify-between items-start gap-8 flex-1">
          <div class="shrink-0 mt-1">
            <div class="flex items-end gap-4">
              <h1 id="info-name-cn" class="text-4xl font-bold text-black tracking-[4px]">에바</h1>
              <h2 id="info-name-en" class="text-2xl text-[var(--sub)] tracking-[6px]">EVA</h2>
            </div>
            <div id="info-sub-label" class="border border-[var(--line-strong)] text-[var(--sub)] text-[10px] inline-flex px-3 py-1 mt-3 tracking-[4px] uppercase font-bold bg-[rgba(255,255,255,0.5)]">
              UNKNOWN FUTURE
            </div>
          </div>

          <div class="flex-1 flex flex-col gap-3 text-[11px] font-bold tracking-[2px] uppercase w-full">
            <div class="flex border-b border-[var(--line)] pb-2 items-center justify-between">
              <div class="flex items-center"><div class="w-2 h-2 bg-black mr-3"></div><span class="text-[var(--sub)]">Height</span></div>
              <span id="stat-height" class="text-black text-right">162cm</span>
            </div>
            <div class="flex border-b border-[var(--line)] pb-2 items-center justify-between">
              <div class="flex items-center"><div class="w-2 h-2 bg-black mr-3"></div><span class="text-[var(--sub)]">Position</span></div>
              <span id="stat-position" class="text-black text-right">전술 지원 / 정찰관</span>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT PAGE -->
      <div id="right-page" class="fade-content flex-1 p-10 pr-16 relative flex flex-col">
        

        <div class="mb-2 w-full flex-1 flex flex-col justify-start">
          <div class="flex items-center gap-4 mb-4 border-b border-[var(--line-strong)] pb-2">
            <div class="w-4 h-4 border-2 border-black flex items-center justify-center"><div class="w-1 h-1 bg-black"></div></div>
            <h3 class="font-orbitron text-black font-bold tracking-[4px] text-lg">STATUS_ANALYSIS</h3>
            <span class="text-[var(--sub)] text-[10px] tracking-[4px] ml-auto -ml-2.5 -mb-1.5">SYS_ACTIVE</span>
          </div>
          
          <div class="flex justify-center items-center py-2 flex-1">
            <div class="relative w-[340px] h-[340px] shrink-0 target-box bg-[rgba(255,255,255,0.5)] border border-[var(--line)]">
              <!-- 최적화: 정적/동적 SVG 그룹 분리 -->
              <svg width="340" height="340" viewBox="0 0 340 340" class="absolute inset-0">
                <g id="radar-bg-group"></g>
                <g id="radar-data-group"></g>
              </svg>
              <div id="radar-chart-labels" class="absolute inset-0 pointer-events-none"></div>
            </div>
          </div>
        </div>

        <div class="mt-auto mb-4 relative z-10 w-full">
          <div class="flex items-center gap-4 mb-3 border-b border-[var(--line-strong)] pb-2 w-full">
            <div class="w-4 h-4 border-2 border-black flex items-center justify-center"><div class="w-1 h-1 bg-black"></div></div>
            <h3 class="font-orbitron text-black font-bold tracking-[4px] text-lg">SKILL_SET</h3>
          </div>
          <div id="skills-container" class="flex flex-col gap-2 max-h-[200px] pr-1 overflow-y-auto"></div>
        </div>
      </div>

      <!-- Navigation Tabs (우측) -->
      <div class="absolute -right-[46px] top-20 flex flex-col gap-1 z-0">
        <div class="relative w-[46px] h-[140px] flex items-center justify-center cursor-pointer transition-all duration-200 origin-left bg-black text-white" style="clip-path: polygon(0 0, 100% 5%, 100% 95%, 0 100%);">
          <div class="whitespace-nowrap tracking-[3px] text-xs font-orbitron font-bold vertical-text rotate-180">01. PROFILE</div>
        </div>
        <div class="relative w-[46px] h-[140px] flex items-center justify-center cursor-pointer transition-all duration-200 origin-left bg-[rgba(0,0,0,0.1)] hover:bg-[rgba(0,0,0,0.2)] text-black border-y border-[var(--line)]" style="clip-path: polygon(0 0, 100% 5%, 100% 95%, 0 100%);">
          <div class="whitespace-nowrap tracking-[3px] text-xs font-orbitron font-bold vertical-text rotate-180">02. ABILITY</div>
        </div>
        <div class="relative w-[46px] h-[140px] flex items-center justify-center cursor-pointer transition-all duration-200 origin-left bg-[rgba(0,0,0,0.1)] hover:bg-[rgba(0,0,0,0.2)] text-black border-y border-[var(--line)]" style="clip-path: polygon(0 0, 100% 5%, 100% 95%, 0 100%);">
          <div class="whitespace-nowrap tracking-[3px] text-xs font-orbitron font-bold vertical-text rotate-180">03. STORY</div>
        </div>
        <div class="relative w-[46px] h-[140px] flex items-center justify-center cursor-pointer transition-all duration-200 origin-left bg-[rgba(0,0,0,0.1)] hover:bg-[rgba(0,0,0,0.2)] text-black border-y border-[var(--line)]" style="clip-path: polygon(0 0, 100% 5%, 100% 95%, 0 100%);">
          <div class="whitespace-nowrap tracking-[3px] text-xs font-orbitron font-bold vertical-text rotate-180">04. FILES</div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
